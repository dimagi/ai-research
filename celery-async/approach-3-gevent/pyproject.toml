[project]
name = "approach-3-gevent"
version = "0.1.0"
description = "Celery async with gevent worker pool approach"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "celery>=5.4",
    "redis>=5.0",
    "requests>=2.31",
    "gevent>=24.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
