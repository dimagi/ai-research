[project]
name = "approach-2-async-to-sync"
version = "0.1.0"
description = "Celery async with Django's async_to_sync/sync_to_async approach"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
