[project]
name = "approach-4-threading"
version = "0.1.0"
description = "Celery async with threading approach"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "celery>=5.4",
    "redis>=5.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
