[project]
name = "celery-gevent-langfuse-bug"
version = "0.1.0"
description = "Reproduction project for Celery + gevent + langfuse bug affecting PostgreSQL SSL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Django>=5.0",
    "celery[redis]>=5.3.0",
    "gevent>=23.0.0",
    "psycopg[binary]>=3.1.0",
    "langfuse>=3.0.0",
    "langgraph>=0.2.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ipdb",
    "pytest",
]

[tool.uv]
dev-dependencies = []
package = false
